name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    if: github.repository == 'nixihz/capslock-bye'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CAPSBYE_NOTARY_PROFILE: capsbye-ci
    steps:
      - name: Set temporary keychain path
        run: echo "CAPSBYE_NOTARY_KEYCHAIN=$RUNNER_TEMP/capsbye-signing.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version and credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The tag must be v<major>.<minor>.<patch> and match Resources/Info.plist.' >&2
            exit 1
          fi
          for secret_name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing release credential: $secret_name. See docs/releasing.md." >&2
              exit 1
            fi
          done
          echo "CAPSBYE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Run tests
        run: swift test
      - name: Import signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/capsbye-signing.p12"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$CAPSBYE_NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CAPSBYE_NOTARY_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CAPSBYE_NOTARY_KEYCHAIN"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" \
            -k "$CAPSBYE_NOTARY_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$CAPSBYE_NOTARY_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$CAPSBYE_NOTARY_KEYCHAIN"
          xcrun notarytool store-credentials "$CAPSBYE_NOTARY_PROFILE" \
            --keychain "$CAPSBYE_NOTARY_KEYCHAIN" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          rm -f "$certificate_path"
      - name: Build signed universal app
        run: ./script/build_and_run.sh --release
      - name: Package DMG, notarize, and verify with Gatekeeper
        run: ./script/notarize.sh
      - name: Prepare versioned and stable download assets
        run: |
          mkdir -p dist/github-release
          cp "dist/release/CapsLock-Bye-$CAPSBYE_VERSION-universal-notarized.dmg" dist/github-release/
          cd dist/github-release
          cp "CapsLock-Bye-$CAPSBYE_VERSION-universal-notarized.dmg" CapsLock-Bye-universal-notarized.dmg
          for archive in *.dmg; do shasum -a 256 "$archive" > "$archive.sha256"; done
          for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/capsbye-release.json"; then
            if [[ $(jq -r .isDraft "$RUNNER_TEMP/capsbye-release.json") != true ]]; then
              echo 'This release is already public. Publish a new version instead of replacing its assets.' >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "CapsLock Bye $CAPSBYE_VERSION" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/github-release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Save notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/notarization-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary credentials
        if: always()
        run: |
          if [[ -f "$CAPSBYE_NOTARY_KEYCHAIN" ]]; then
            security delete-keychain "$CAPSBYE_NOTARY_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/capsbye-signing.p12"
