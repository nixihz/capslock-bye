name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Resources/Info.plist (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    if: github.repository == 'nixihz/capslock-bye'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CAPSBYE_NOTARY_PROFILE: capsbye-ci
    steps:
      - name: Set temporary keychain path
        run: echo "CAPSBYE_NOTARY_KEYCHAIN=$RUNNER_TEMP/capsbye-signing.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Resources/Info.plist must use <major>.<minor>.<patch>.' >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || "${VERSION_INPUT#v}" != "$version" ]]; then
              echo 'Dispatch from main with a version matching Resources/Info.plist.' >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'The version tag must match Resources/Info.plist.' >&2
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          remote_tags=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          tag_commit=$(printf '%s\n' "$remote_tags" | awk '
            /\^\{\}$/ { peeled = $1; next }
            { tag = $1 }
            END { print peeled ? peeled : tag }
          ')
          if [[ -n "$tag_commit" && "$tag_commit" != "$source_commit" ]]; then
            echo "Tag $tag already points to a different commit." >&2
            exit 1
          fi
          {
            echo "CAPSBYE_VERSION=$version"
            echo "CAPSBYE_TAG=$tag"
            echo "CAPSBYE_SOURCE_COMMIT=$source_commit"
          } >> "$GITHUB_ENV"
      - name: Validate release credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for secret_name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD API_KEY_BASE64 API_KEY_ID API_ISSUER_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing release credential: $secret_name. See docs/releasing.md." >&2
              exit 1
            fi
          done
      - name: Run tests
        run: swift test
      - name: Import signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/capsbye-signing.p12"
          api_key_path="$RUNNER_TEMP/capsbye-notary.p8"
          trap 'rm -f "$certificate_path" "$api_key_path"' EXIT
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$CAPSBYE_NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CAPSBYE_NOTARY_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CAPSBYE_NOTARY_KEYCHAIN"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" \
            -k "$CAPSBYE_NOTARY_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$CAPSBYE_NOTARY_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$CAPSBYE_NOTARY_KEYCHAIN"
          signing_identity=$(security find-identity -v -p codesigning "$CAPSBYE_NOTARY_KEYCHAIN" \
            | awk '/"Developer ID Application:/ && !identity { identity = $2 } END { print identity }')
          if [[ -z "$signing_identity" ]]; then
            echo 'No valid Developer ID Application identity was imported.' >&2
            exit 1
          fi
          echo "CAPSBYE_SIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$api_key_path"
          xcrun notarytool store-credentials "$CAPSBYE_NOTARY_PROFILE" \
            --keychain "$CAPSBYE_NOTARY_KEYCHAIN" --key "$api_key_path" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
      - name: Build signed universal app
        run: ./script/build_and_run.sh --release
      - name: Package DMG, notarize, and verify with Gatekeeper
        run: ./script/notarize.sh
      - name: Prepare versioned download assets
        run: |
          mkdir -p dist/github-release
          cp "dist/release/CapsLock-Bye-$CAPSBYE_VERSION-universal-notarized.dmg" dist/github-release/
          cd dist/github-release
          archive="CapsLock-Bye-$CAPSBYE_VERSION-universal-notarized.dmg"
          shasum -a 256 "$archive" > "$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$CAPSBYE_TAG" --json isDraft > "$RUNNER_TEMP/capsbye-release.json"; then
            if [[ $(jq -r .isDraft "$RUNNER_TEMP/capsbye-release.json") != true ]]; then
              echo 'This release is already public. Publish a new version instead of replacing its assets.' >&2
              exit 1
            fi
          else
            tag_args=(--verify-tag)
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              tag_args=(--target "$CAPSBYE_SOURCE_COMMIT")
            fi
            gh release create "$CAPSBYE_TAG" "${tag_args[@]}" --draft \
              --title "CapsLock Bye $CAPSBYE_VERSION" --generate-notes
          fi
          archive="dist/github-release/CapsLock-Bye-$CAPSBYE_VERSION-universal-notarized.dmg"
          gh release upload "$CAPSBYE_TAG" "$archive" "$archive.sha256" --clobber
          gh release edit "$CAPSBYE_TAG" --draft=false --latest
      - name: Save notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/notarization-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary credentials
        if: always()
        run: |
          if [[ -f "$CAPSBYE_NOTARY_KEYCHAIN" ]]; then
            security delete-keychain "$CAPSBYE_NOTARY_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/capsbye-signing.p12" "$RUNNER_TEMP/capsbye-notary.p8"
